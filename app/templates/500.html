{% extends "base.html" %}
{% block title %}Something went wrong | MediBook{% endblock %}
{% block content %}
<section class="section"><div class="container narrow center">
  <h1 class="page-title">{{ title or 'Something went wrong' }}</h1>
  <p class="muted">{{ message or 'The server could not complete your request. Please try again in a moment.' }}</p>
  <a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to Home</a>
</div></section>
{% endblock %}
