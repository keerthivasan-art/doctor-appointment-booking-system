{% extends "base.html" %}
{% block title %}Admin Login | MediBook{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <h1 class="page-title">Administrator login</h1>
    <form class="form-card" method="post" action="{{ url_for('admin.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username"></div>
      <div class="field"><label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
  </div>
</section>
{% endblock %}
